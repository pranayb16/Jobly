[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobly-backend"
version = "1.0.0"
description = "Jobly crawling, enrichment, and FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4==4.15.0",
    "fastapi==0.142.1",
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
    "pydantic==2.13.5",
    "python-dotenv==1.2.3",
    "requests==2.34.2",
    "urllib3==2.8.0",
    "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
    "pandas==2.3.3",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["jobly*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: live tests that require external ATS network access",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F"]
