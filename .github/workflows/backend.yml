name: Backend

on:
  push:
    paths: ["backend/**", "migrations/**", ".dockerignore", "Makefile", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "migrations/**", ".dockerignore", "Makefile", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - name: Build backend image with migrations
        working-directory: .
        run: docker build -f backend/Dockerfile -t jobly-backend:ci .
